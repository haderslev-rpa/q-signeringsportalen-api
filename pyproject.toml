[project]
name = "q-signeringsportalen-api"
version = "0.1.0"
description = "Python-klient til SG.DokSigner API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "automation-server-client",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git", tag = "v0.3.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["q_signeringsportalen_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
